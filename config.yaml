name: "GCal Bot"
version: "1.4.2"
slug: "gcal_bot"
description: "Telegram bot: posts Google Calendar events as reminders in any Telegram group that runs /onboard, with Yes/No/Maybe RSVP buttons"
url: "https://github.com/christoph-teichmeister/gcal-bot"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
options:
  bot_token: ""
  poll_interval_minutes: 15
  lookahead_days: 30
schema:
  bot_token: str
  poll_interval_minutes: float
  lookahead_days: int
